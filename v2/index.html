<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABRP v2</title>
<style>
:root{--bg:#050a15;--card:#0d1525;--bd:#1e293b;--g:#4ade80;--b:#38bdf8;--r:#dc2626;--o:#fb923c;--y:#fbbf24;--t:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--t);font-size:14px;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;
  position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:50}
h1{font-size:.88rem;color:var(--g);text-transform:uppercase;letter-spacing:1px}
.topBtns{display:flex;gap:6px}
.topBtns button{background:transparent;border:1px solid var(--bd);color:#8b9eb8;border-radius:8px;
  padding:8px 10px;font-size:.72rem;font-weight:700;cursor:pointer;white-space:nowrap}
.topBtns button.on{border-color:var(--o);color:var(--o);background:rgba(251,146,60,.12)}
h3{font-size:.8rem;color:var(--b);text-transform:uppercase;margin-bottom:10px;
   border-bottom:1px solid var(--bd);padding-bottom:6px;display:flex;justify-content:space-between;gap:8px}
h3 small{color:#475569;font-weight:400;text-transform:none;font-size:.68rem}
.wrap{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:340px 1fr 360px;gap:14px}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.inp{margin-bottom:14px}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.lb{color:#8b9eb8;font-size:.78rem;font-weight:600}
.vl{font-family:monospace;font-weight:900;color:var(--b)}
select{width:100%;background:#0a1220;color:var(--t);border:1px solid var(--bd);
  border-radius:6px;padding:8px;font-size:.8rem;margin-top:4px;outline:none}
select:focus{border-color:var(--b)}
input[type=range]{width:100%;height:6px;background:var(--bd);-webkit-appearance:none;
  border-radius:3px;outline:none;margin:12px 0;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  background:var(--b);border-radius:4px;cursor:pointer;box-shadow:0 0 10px var(--b)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;background:var(--b);
  border-radius:4px;cursor:pointer;border:none}
body.locked input[type=range],body.locked select{pointer-events:none;opacity:.45}
.ends{display:flex;justify-content:space-between;font-size:.65rem;color:#64748b}
.row{display:flex;justify-content:space-between;padding:5px 0;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:.8rem}
.row b{font-family:monospace;white-space:nowrap}
.row.sub2{font-size:.7rem;color:#64748b;border:none;padding:2px 0;line-height:1.4}
.row.hi{background:rgba(56,189,248,.08);padding:6px;border-radius:4px;border:none;margin:2px 0}
.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--o)}
.balance{text-align:center;padding:18px;border-radius:12px;border:3px solid var(--g);margin-top:12px;
  background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(56,189,248,.1))}
.balance.warn{border-color:var(--o);background:rgba(251,146,60,.12)}
.balance.bad{border-color:var(--r);background:rgba(220,38,38,.12)}
.balance .lbl{font-size:.7rem;text-transform:uppercase;color:#94a3b8;letter-spacing:1px}
.balance .num{font-size:2rem;font-weight:900;font-family:monospace;color:var(--g);margin:6px 0}
.balance.warn .num{color:var(--o)}.balance.bad .num{color:var(--r)}
.balance .sub{font-size:.7rem;color:#94a3b8;line-height:1.6}
#presetDesc{font-size:.72rem;color:#64748b;margin-top:6px;line-height:1.5}

#filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{background:rgba(255,255,255,.03);border:1px solid var(--bd);border-radius:8px;
  padding:7px 10px;cursor:pointer;color:#8b9eb8;display:flex;align-items:center;gap:6px;
  font-size:.7rem;font-weight:700;transition:.15s}
.fbtn:hover{border-color:var(--b)}
.fbtn.on{border-color:var(--y);background:rgba(251,191,36,.12);color:var(--y)}
.fi{font-size:1rem;line-height:1}
@media(max-width:520px){.fl{display:none}.fbtn{padding:9px 12px}}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.city{background:rgba(255,255,255,.02);border:1px solid var(--bd);border-radius:6px;
  padding:8px 6px 10px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.city:hover{border-color:var(--b);transform:translateY(-2px)}
.city.sel{border:2px solid var(--g);box-shadow:0 0 16px rgba(74,222,128,.4)}
.cb{height:14px;font-size:.62rem;letter-spacing:1px;margin-bottom:2px;opacity:.95}
.city img{width:26px;height:19px;object-fit:cover;border-radius:2px}
.cn{font-weight:800;font-size:.74rem;margin:4px 0 3px}
.cv{font-family:monospace;font-weight:800;font-size:.82rem;color:var(--t)}
.cs{font-size:.62rem;margin-top:2px;font-family:monospace;color:#64748b}
#cityName{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:800;margin-bottom:10px;flex-wrap:wrap}
#cityName img{width:28px;height:21px;border-radius:3px}
#cityName small{color:#64748b;font-weight:400;font-size:.7rem;width:100%}
#cityName small.note{color:var(--y);font-weight:600;margin-top:2px}
#advice{font-size:.75rem;color:#94a3b8;background:rgba(251,146,60,.1);
  border:1px dashed var(--o);border-radius:6px;padding:9px;margin-top:8px;line-height:1.5}
#advice b{color:var(--o)}
.tip{background:rgba(255,255,255,.03);border-left:3px solid var(--b);border-radius:0 6px 6px 0;
  padding:9px 10px;margin-bottom:8px}
.tipTxt{font-size:.75rem;line-height:1.55;color:#cbd5e1}
.tipFoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.tipFoot span{font-family:monospace;font-weight:800;font-size:.78rem}
.tipBtn{background:var(--b);color:#04121f;border:none;border-radius:5px;padding:4px 12px;
  font-size:.68rem;font-weight:800;cursor:pointer;margin-left:auto}
.tip.ver-V{border-left-color:var(--g)}
.tip.ver-P{border-left-color:var(--o)}
.tip.ver-E{border-left-color:var(--r)}
.src{font-size:.68rem;color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="top">
  <h1 data-t="title">ABRP v2</h1>
  <div class="topBtns">
    <button id="langBtn">🇬🇧 EN</button>
    <button id="lockBtn">🔓</button>
  </div>
</div>
<div class="wrap">

  <div>
    <div class="card">
      <h3 data-t="scenarios">Сценарии</h3>
      <select id="sPreset"></select>
      <div id="presetDesc"></div>
    </div>

    <div class="card">
      <h3 data-t="family">Семейство и жилище</h3>
      <div class="inp"><div class="ih"><span class="lb" data-t="adults"></span><span class="vl" id="vAdults"></span></div>
        <input type="range" id="sAdults" min="1" max="4" value="2"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="kids"></span><span class="vl" id="vKids"></span></div>
        <input type="range" id="sKids" min="0" max="5" value="3"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="rent"></span><span class="vl bad" id="vRent"></span></div>
        <input type="range" id="sRent" min="450" max="2200" step="50" value="900"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="budget"></span><span class="vl bad" id="vBudget"></span></div>
        <input type="range" id="sBudget" min="400" max="5000" step="50" value="1040"></div>
    </div>

    <div class="card">
      <h3 data-t="platform">Платформа и стратегия</h3>
      <div class="inp">
        <div class="ih"><span class="lb" data-t="via"></span><span class="vl" id="vComm"></span></div>
        <select id="sPlatform"></select>
        <input type="range" id="sComm" min="0" max="50" step="1" value="15">
        <div class="ends"><span data-t="noComm"></span><span>50%</span></div>
      </div>
      <div class="inp">
        <div class="ih"><span class="lb" data-t="howDrive"></span><span class="vl" id="vStrategy"></span></div>
        <input type="range" id="sStrategy" min="0" max="100" step="5" value="80">
        <div class="ends"><span data-t="stayEnd"></span><span data-t="moveEnd"></span></div>
      </div>
      <div class="inp">
        <div class="ih"><span class="lb" data-t="flow"></span><span class="vl" id="vFlow"></span></div>
        <input type="range" id="sFlow" min="0" max="100" step="5" value="20">
        <div class="ends"><span data-t="flowLo"></span><span data-t="flowHi"></span></div>
      </div>
      <div class="inp">
        <div class="ih"><span class="lb" data-t="comfort"></span><span class="vl" id="vComfort"></span></div>
        <input type="range" id="sComfort" min="0" max="100" step="5" value="50">
      </div>
      <div id="advice"></div>
    </div>

    <div class="card">
      <h3 data-t="shiftCosts">Смяна и разходи</h3>
      <div class="inp"><div class="ih"><span class="lb" data-t="wheelHours"></span><span class="vl" id="vHours"></span></div>
        <input type="range" id="sHours" min="3" max="14" value="10"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="awayHours"></span><span class="vl" id="vCommit"></span></div>
        <input type="range" id="sCommit" min="3" max="16" value="12">
        <div class="ends"><span data-t="splitNote"></span></div></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="peak"></span><span class="vl" id="vPeak"></span></div>
        <input type="range" id="sPeak" min="0" max="100" step="5" value="60">
        <div class="ends"><span data-t="anyTime"></span><span data-t="peaksOnly"></span></div></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="days"></span><span class="vl" id="vDays"></span></div>
        <input type="range" id="sDays" min="15" max="28" value="26"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="kmCap"></span><span class="vl" id="vKm"></span></div>
        <input type="range" id="sKm" min="80" max="450" step="10" value="250"></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="car"></span><span class="vl bad" id="vCar"></span></div>
        <input type="range" id="sCar" min="100" max="2500" step="50" value="200">
        <div class="ends"><span data-t="carNote"></span></div></div>
      <div class="inp"><div class="ih"><span class="lb" data-t="tips"></span><span class="vl good" id="vTips"></span></div>
        <input type="range" id="sTips" min="0" max="1000" step="25" value="150"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h3><span data-t="cities">Градове</span><small id="gridUnit"></small></h3>
      <div id="filters"></div>
      <div id="grid"></div>
    </div>
    <div class="card"><h3 data-t="optimise">Оптимизация</h3><div id="tipsOut"></div></div>
  </div>

  <div>
    <div class="card"><div id="cityName"></div><h3 data-t="oneShift">Една смяна</h3><div id="shiftOut"></div></div>
    <div class="card"><h3 data-t="monthly">Месечно</h3><div id="monthOut"></div><div id="balance" class="balance"></div></div>
    <div class="card"><h3 data-t="taxes">Данъци</h3><div id="taxOut"></div></div>
  </div>

</div>
<script type="module">
  import { init } from './src/ui/app.js';
  init();
</script>
</body>
</html>
